[package]
name = "mouth"
version = "0.1.0"
description = "The mouth of an Emory device: plays the voice that comes back from the server on a speaker"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
contract.workspace = true
serde.workspace = true
anyhow = "1"
async-nats = "0.50"
bytes = "1"
cpal = "0.17"
futures-util = "0.3"
gethostname = "1"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "emory-mouth"
path = "src/main.rs"

[[bin]]
name = "mouth-press"
path = "src/bin/press.rs"
