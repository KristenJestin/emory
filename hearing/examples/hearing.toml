# Configuration of the hearing: `hearing hearing/examples/hearing.toml` (from the repository root).
# A relative path in this file is read from the folder of this file.
# The models: `scripts/download-models.sh` (into ~/.cache/emory/models/).

[nats]
url = "nats://127.0.0.1:4222"
# On the locked-down server: the certificate of the authority (TLS is required if it is given) and
# the file with the seed of this program's nkey.
# ca = "/etc/emory/ca.pem"
# nkey = "/etc/emory/hearing.nk"

[models]
vad = "~/.cache/emory/models/silero_vad.onnx"
parakeet = "~/.cache/emory/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"

[transcription]
threads = 4
# Where Parakeet computes: "cpu" (default) or "cuda" (an NVIDIA GPU, needs the CUDA build:
# scripts/build-cuda.sh). This file is the development PC's: CPU, int8. The server's setup (CUDA,
# the fp32 model, no silent fallback to the CPU) is examples/hearing-server.toml; see "Run on an
# NVIDIA GPU" in the README.
# provider = "cuda"
# precision = "fp32"           # "int8" or "fp32"; absent: the int8 files of the folder, else fp32
# fallback_to_cpu = true       # with "cuda": load on the CPU, with a warning, if the card fails
# The user's own words live outside the repository, in the data folder ($XDG_DATA_HOME/emory,
# ~/.local/share/emory by default; on the server, a volume): the vocabulary (hotwords.txt) and the
# corrections table (corrections.tsv). The files of this folder are starting points to copy there.
# Give other paths here if needed (a given corrections table must exist; the vocabulary file is
# created at the first word the mind adds).
# corrections = "~/.local/share/emory/corrections.tsv"
# The vocabulary (names Parakeet gets wrong): with words in it, the beam search replaces the greedy
# one, for about a fifth to a half more compute per sentence; an empty file keeps the greedy search
# (and a word added then counts from the next start). The words the mind adds (once the user said
# yes) are appended to it and used from the next sentence. Needs the bpe.vocab that
# scripts/download-models.sh writes.
# hotwords = "~/.local/share/emory/hotwords.txt"
hotwords_score = 2.0

# Silero VAD settings; the values given are those of the test bench.
[vad]
threshold = 0.5
min_silence = 0.5
min_speech = 0.25
max_speech = 20.0
# Silero stays on the CPU: on the GPU it is about seven times slower (a model this small is
# only waiting for the data to travel).
# provider = "cpu"
