# Configuration of the hearing: `hearing examples/hearing.toml`
# The models: `scripts/download-models.sh` (into ~/.cache/emory/models/).

[nats]
url = "nats://127.0.0.1:4222"
# On the locked-down server: the certificate of the authority (TLS is required if it is given) and
# the file with the seed of this program's nkey.
# ca = "/etc/emory/ca.pem"
# nkey = "/etc/emory/hearing.nk"

[models]
vad = "~/.cache/emory/models/silero_vad.onnx"
parakeet = "~/.cache/emory/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"

[transcription]
threads = 4
corrections = "examples/corrections.tsv"

# Silero VAD settings; the values given are those of the test bench.
[vad]
threshold = 0.5
min_silence = 0.5
min_speech = 0.25
max_speech = 20.0
