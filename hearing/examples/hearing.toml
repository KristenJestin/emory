# Configuration of the hearing: `hearing hearing/examples/hearing.toml` (from the repository root).
# A relative path in this file is read from the folder of this file.
# The models: `scripts/download-models.sh` (into ~/.cache/emory/models/).

[nats]
url = "nats://127.0.0.1:4222"
# On the locked-down server: the certificate of the authority (TLS is required if it is given) and
# the file with the seed of this program's nkey.
# ca = "/etc/emory/ca.pem"
# nkey = "/etc/emory/hearing.nk"

[models]
vad = "~/.cache/emory/models/silero_vad.onnx"
parakeet = "~/.cache/emory/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"

[transcription]
threads = 4
# Where Parakeet computes: "cpu" (default) or "cuda" (an NVIDIA GPU, needs the CUDA build:
# scripts/build-cuda.sh). See "Run on an NVIDIA GPU" in the README before using it.
# provider = "cuda"
corrections = "corrections.tsv"
# The vocabulary (names Parakeet gets wrong): the beam search replaces the greedy one, for about a
# fifth to a half more compute per sentence. Remove the line, or empty the file, for the greedy
# search. Needs the bpe.vocab that scripts/download-models.sh writes.
hotwords = "hotwords.txt"
hotwords_score = 2.0

# Silero VAD settings; the values given are those of the test bench.
[vad]
threshold = 0.5
min_silence = 0.5
min_speech = 0.25
max_speech = 20.0
# Silero stays on the CPU: on the GPU it is about seven times slower (a model this small is
# only waiting for the data to travel).
# provider = "cpu"
