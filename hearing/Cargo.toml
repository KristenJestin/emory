[package]
name = "hearing"
version = "0.1.0"
description = "The hearing of Emory: from the audio of the ears to the transcribed sentences and turn"
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "hearing"

[features]
# The CPU build links onnxruntime statically (downloaded by the crate's build script).
default = ["sherpa-onnx/static"]
# The CUDA build links sherpa-onnx and onnxruntime as shared libraries, taken from the CUDA
# archive of the sherpa-onnx release (`SHERPA_ONNX_LIB_DIR`): see README.md.
cuda = ["sherpa-onnx/shared"]

[dependencies]
contract.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
async-nats = "0.50"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = "0.3"
hound = "3.5"
regex = "1"
sherpa-onnx = { version = "1.13.8", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[[bin]]
name = "hearing"
path = "src/main.rs"

[[bin]]
name = "hearing-replay"
path = "src/bin/replay.rs"

[[bin]]
name = "hearing-measure"
path = "src/bin/measure.rs"
