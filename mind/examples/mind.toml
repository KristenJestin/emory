# Configuration of the mind: `mind mind/examples/mind.toml` (paths relative to where it runs).

[nats]
url = "nats://127.0.0.1:4222"
# On the locked-down server: the certificate of the authority (TLS is required if it is given) and
# the file with the seed of this program's nkey.
# ca = "/etc/emory/ca.pem"
# nkey = "/etc/emory/mind.nk"

# The LLM, through an ACP adapter that the mind starts and drives over stdio. The adapter inherits
# the environment: the local Claude Code login in development, `CLAUDE_CODE_OAUTH_TOKEN` when set.
[llm]
command = "npx"
args = ["-y", "@agentclientprotocol/claude-agent-acp@0.89.1"]
model = "claude-haiku-5-5"
effort = "low"
system_prompt = "mind/prompts/system.fr.md"
# workdir = "/var/lib/emory/mind"   # default: a folder in the system's temporary directory

[conversation]
# Minutes without an exchange before a conversation (and its LLM session) closes.
idle_minutes = 30
# Said when a turn reaches the mind with nothing in it (near-silence heard): no request to the LLM.
nothing_heard = "Je n'ai rien entendu."

# The long-term memory, by MCP. The key is read from its file when the connection opens.
[hippocampe]
url = "https://hippocampe.example/mcp"
token_file = "/etc/emory/hippocampe.token"
# The search made on each sentence while the owner speaks: how many entries, and when to give up.
search_limit = 5
search_timeout_ms = 300
# Hippocampe's tools offered to the LLM (as `hippocampe_<name>`), when the key allows them.
tools = ["search", "read", "write", "link", "types"]
# How long a tool call of the LLM may wait for Hippocampe.
tool_timeout_ms = 10000

# Who Emory talks to. The instructions (`prompts/system.fr.md`) are a template filled from here
# (`{owner}` and `{address}`); without this section they name nobody and only say to use « tu ».
[owner]
name = "Alex"                        # without it: « la personne qui te parle »
address = "une femme ; tu la tutoies"   # free text, in the language of the instructions

# The dictionary: the LLM may add a word to the hearing's vocabulary, only after the user said yes
# in a later turn (dictionary_propose, then dictionary_add).
[dictionary]
enabled = true
timeout_ms = 2000   # how long to wait for the hearing's reply

# What the owner hears while the answer is prepared (1 to 2 s without a tool, 3 to 5 s when the LLM
# reads the memory). One of three modes; the sounds themselves are drawn by the voice (`[cue]` in
# its configuration: volume, shape of the tone, time between pulses).
[waiting]
# "off": nothing (the default). "tone": a short tone of two rising notes as soon as the owner's
# turn is closed, then, if no answer has started after `pulse_delay_ms`, a soft pulse that stops
# the moment the first word plays. "speech": a short phrase said by the voice while the LLM works.
mode = "off"
pulse_delay_ms = 1500   # tone: how long without an answer before the pulse starts
# For `mode = "speech"`:
# speech_delay_ms = 800        # how long without an answer before a pre-written phrase
# source = "both"              # "prewritten": only after the delay; "contextual": only at a tool
#                              # call, about what is searched; "both": a tool call gives the
#                              # contextual phrase, the delay a pre-written one
# max_phrases = 2              # at most this many per turn, 2.5 s apart at least
# phrases = "mind/prompts/waiting.fr.toml"   # the file of phrases; the built-in ones without it

# Emory's MCP server, served to the adapter only: loopback, any free port, a key drawn at start-up.
[tools]
bind = "127.0.0.1:0"
