# Configuration of the mind: `mind mind/examples/mind.toml` (paths relative to where it runs).

[nats]
url = "nats://127.0.0.1:4222"
# On the locked-down server: the certificate of the authority (TLS is required if it is given) and
# the file with the seed of this program's nkey.
# ca = "/etc/emory/ca.pem"
# nkey = "/etc/emory/mind.nk"

# The LLM. `mode = "acp"` (the default): an ACP adapter that the mind starts and drives over stdio.
# The adapter inherits the environment: the local Claude Code login in development,
# `CLAUDE_CODE_OAUTH_TOKEN` when set.
[llm]
mode = "acp"
command = "npx"
args = ["-y", "@agentclientprotocol/claude-agent-acp@0.89.1"]
model = "claude-haiku-5-5"
effort = "low"
# thinking = "off"     # "off" (default), "adaptive", or a budget of tokens (2048)
# fast = false         # fast mode: Opus 5.5, 5 and 4.8 only, billed from usage credits (extra
#                      # usage, outside the plan): see specs/mind.md before turning it on
system_prompt = "mind/prompts/system.fr.md"
# workdir = "/var/lib/emory/mind"   # default: a folder in the system's temporary directory

# Or `mode = "api"`: the mind calls a provider's API itself and runs Emory's tools in its process.
# [llm]
# mode = "api"
# provider = "anthropic"   # anthropic, openai, openai_resp, gemini, groq, mistral, deepseek, xai,
#                          # together, fireworks, open_router, cerebras, ollama, openai_compatible
# model = "claude-haiku-5-5"
# key_file = "/etc/emory/anthropic.key"   # read at each request, never logged
# base_url = "https://host/v1/"   # another address (needed with openai_compatible)
# thinking = "off"
# effort = "low"           # Anthropic: sent as is; others: the depth of thinking = "adaptive"
# max_tokens = 2048        # the longest answer, thinking included
# cache = true             # prompt caching (Anthropic): instructions, tools and the history
# fast = false             # Anthropic, Opus 5.5, 5 and 4.8 only, at a premium price
# system_prompt = "mind/prompts/system.fr.md"

[conversation]
# Minutes without an exchange before a conversation (and its LLM session) closes.
idle_minutes = 30
# Said when a turn reaches the mind with nothing in it (near-silence heard): no request to the LLM.
nothing_heard = "Je n'ai rien entendu."

# The long-term memory, by MCP. The key is read from its file when the connection opens.
[hippocampe]
url = "https://hippocampe.example/mcp"
token_file = "/etc/emory/hippocampe.token"
# The search made on each sentence while the owner speaks: how many entries, and when to give up.
search_limit = 5
search_timeout_ms = 300
# Hippocampe's tools offered to the LLM (as `hippocampe_<name>`), when the key allows them.
tools = ["search", "read", "write", "link", "types"]
# How long a tool call of the LLM may wait for Hippocampe.
tool_timeout_ms = 10000

# Who Emory talks to. The instructions (`prompts/system.fr.md`) are a template filled from here
# (`{owner}` and `{address}`); without this section they name nobody and only say to use « tu ».
[owner]
name = "Alex"                        # without it: « la personne qui te parle »
address = "une femme ; tu la tutoies"   # free text, in the language of the instructions

# Emory speaking on her own when a program asks (specs/events.md); the sources come later.
[events]
chime = true   # a short tone before she speaks; false: the sentence alone

# The dictionary: the LLM may add a word to the hearing's vocabulary, only after the user said yes
# in a later turn (dictionary_propose, then dictionary_add).
[dictionary]
enabled = true
timeout_ms = 2000   # how long to wait for the hearing's reply

# The web (`web_weather`: the weather; `web_wikipedia`: the summary of a Wikipedia article, French
# first; `web_search`: a search of the web). Every key has the value shown; without this section the module is on with these values.
# No key, no account.
[web]
enabled = true         # false takes every web tool away
# user_agent = "Emory/0.1 (assistant vocal; contact: you@example.org)"
#                      # sent to Wikimedia, which wants a way to reach the author: add a contact
timeout_ms = 5000      # for one call to an API

[web.weather]
enabled = true
place = ""             # your place, by its name (Open-Meteo finds it): "Lyon", and "Lyon, France" when
#                      # a name is shared by cities of several countries. Empty: the LLM is given none
# latitude = 45.75     # optional, both or none: they save the lookup of the name
# longitude = 4.85
cache_minutes = 10     # a forecast is kept this long (0: never)

[web.wikipedia]
enabled = true
languages = ["fr", "en"]   # tried in this order: the next one is asked when the previous has nothing
max_chars = 1200           # the longest summary given to the LLM

# The search reads DuckDuckGo's light HTML page: no key, nothing hosted, and it breaks when
# DuckDuckGo changes the page (or takes the program for a robot). Emory sees it and says it:
# `cargo run -p mind --example web-check` tells which case it is. The provider can be replaced.
[web.search]
provider = "duckduckgo"    # or "none": the tool `web_search` is taken away
region = "fr-fr"           # DuckDuckGo's region: "us-en", "uk-en", "wt-wt" (none)...
max_results = 5            # 1 to 10, what the LLM gets at most
timeout_ms = 5000          # for one search
min_interval_ms = 1000     # at least this long between two requests to DuckDuckGo
cache_minutes = 10         # the same question is not asked again for this long (0: never)
backoff_minutes = 30       # after a block or a changed page, DuckDuckGo is left alone for this long
# user_agent = "..."       # a browser's: the page refuses a robot more willingly (the default is Firefox's)

# Where `mind` keeps what must outlive it (the timers today). Created if missing; in a container,
# a volume.
[data]
# dir = "~/.local/state/emory/mind"   # the default: $XDG_STATE_HOME/emory/mind

# The timers and reminders (`time_timer`, `time_reminder`, `time_list`, `time_cancel`), kept in
# `<data.dir>/timers.json` and read again after a restart. Every key has the value shown; without
# this section the module is on with these values. At the due time Emory says the phrase on the
# device the timer was set on, after a tone, and again if nobody pressed there.
[time]
enabled = true
# store = "/path/to/timers.json"   # default: timers.json in data.dir
timezone = ""                      # "Europe/Paris"; empty: the system's zone (TZ)
# default_device = "office"        # rings here when the timer has no device (default: where the owner last spoke)
max_active = 50                    # timers and reminders waiting at once
chime = true                       # a short tone before the phrase
repeat = 1                         # said again this many times (0 to 5) if nobody pressed
repeat_after_s = 60                # seconds before it is said again (10 to 600)
late_limit_hours = 12              # missed during a stop: said late up to this, dropped beyond
timer_done = "Le minuteur {label} est fini."
timer_done_unlabeled = "Le minuteur de {duration} est fini."  # {duration} in words
reminder = "Rappel : {text}."

# What the owner hears while the answer is prepared (1 to 2 s without a tool, 3 to 5 s when the LLM
# reads the memory). One of three modes; the sounds themselves are drawn by the voice (`[cue]` in
# its configuration: volume, shape of the tone, time between pulses).
[waiting]
# "off": nothing (the default). "tone": a short tone of two rising notes as soon as the owner's
# turn is closed, then, if no answer has started after `pulse_delay_ms`, a soft pulse that stops
# the moment the first word plays. "speech": a short phrase said by the voice while the LLM works.
mode = "off"
pulse_delay_ms = 1500   # tone: how long without an answer before the pulse starts; speech with
#                         pulse_after_speech: how long after a phrase is over
# For `mode = "speech"`:
# speech_delay_ms = 800        # how long without an answer before a pre-written phrase
# source = "both"              # "prewritten": only after the delay; "contextual": only at a tool
#                              # call, about what is searched; "both": a tool call gives the
#                              # contextual phrase, the delay a pre-written one
# max_phrases = 2              # at most this many per turn (1 to 5)
# phrase_spacing_ms = 2500     # at least this long between two phrases (0 to 60000)
# phrase_spacing_from = "start"   # counted from the "start" of the previous phrase, or from its
#                                 # "end": the mind estimates it from the text (a few hundred ms
#                                 # to start sounding, then about 70 ms a character), so that
#                                 # the spacing is the silence between two phrases
# pulse_after_speech = false   # true: once a phrase is over and no answer has started after
#                              # pulse_delay_ms, the soft pulse of "tone" fills the silence until
#                              # the first word; a later phrase is still said, between the pulses
# prewritten_repeat_ms = 0     # 0: none. Otherwise: with source "prewritten" or "both", another
#                              # pre-written phrase after this much silence since the last phrase
#                              # (never closer than phrase_spacing_ms, never past max_phrases)
# phrases = "mind/prompts/waiting.fr.toml"   # the file of phrases; the built-in ones without it

# Emory's MCP server, served to the ACP adapter only (none in api mode): loopback, any free port, a
# key drawn at start-up.
[tools]
bind = "127.0.0.1:0"
