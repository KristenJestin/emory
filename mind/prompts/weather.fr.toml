# Les mots de la météo d'Emory (`web_weather`), en français. Intégré au programme, comme les
# phrases d'attente. Les codes sont ceux de l'OMM (WMO) que donne Open-Meteo.
#
# Ce que le LLM reçoit pour `sky` : quelques mots qu'il peut dire tels quels, sans le code.

# Le nom des jours d'après-demain à la fin de la semaine, et des deux premiers.
today = "aujourd'hui"
tomorrow = "demain"
# Du lundi au dimanche.
weekdays = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"]

# Pour un code que cette table ne connaît pas.
unknown = "temps indéterminé"

[sky]
0 = "ciel dégagé"
1 = "plutôt dégagé"
2 = "partiellement nuageux"
3 = "couvert"
45 = "brouillard"
48 = "brouillard givrant"
51 = "bruine faible"
53 = "bruine"
55 = "bruine forte"
56 = "bruine verglaçante faible"
57 = "bruine verglaçante forte"
61 = "pluie faible"
63 = "pluie"
65 = "pluie forte"
66 = "pluie verglaçante faible"
67 = "pluie verglaçante forte"
71 = "neige faible"
73 = "neige"
75 = "neige forte"
77 = "grains de neige"
80 = "averses faibles"
81 = "averses"
82 = "averses violentes"
85 = "averses de neige faibles"
86 = "averses de neige fortes"
95 = "orage"
96 = "orage avec un peu de grêle"
99 = "orage avec de la grêle"
