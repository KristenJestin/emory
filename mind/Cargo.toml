[package]
name = "mind"
version = "0.1.0"
description = "The mind of Emory: the conversation, the LLM through ACP or an API, the memory, the sentences to say"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
contract.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle = "2"
agent-client-protocol = { version = "3.3", features = ["process"] }
anyhow = "1"
async-nats = "0.50"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = "0.3"
# The LLM through a provider's API (`llm.mode = "api"`); 0.7 has no final release yet.
genai = "=0.7.0-rc.4"
rmcp = { version = "3.5", default-features = false, features = ["client", "server", "macros", "reqwest", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "mind"
path = "src/main.rs"
