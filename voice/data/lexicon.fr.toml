# Le lexique de prononciation de la voix d'Emory, en français.
#
# Un moteur de voix français lit « GitHub » comme « jithub » et « SSH » comme un mot. Avant la
# synthèse, `voice` passe chaque phrase par ce lexique : il remplace des mots par une écriture que
# le moteur lit bien. Ce fichier est celui livré avec le programme, utilisé quand la configuration
# ne donne pas de fichier. Pour avoir le sien, le copier, le modifier, puis donner son chemin dans
# `lexicon = "..."` de la configuration de `voice` (un chemin relatif part du dossier de ce fichier
# de configuration ; un fichier donné remplace celui-ci, il ne s'y ajoute pas).
#
# Comment ajouter un mot : une ligne dans `[replace]`, le mot tel qu'il est écrit à gauche, comment
# le dire à droite, écrit comme il se prononce en français :
#
#     GitHub = "guite-heub"
#
# - Le mot est cherché en entier (« Git » ne touche pas « GitHub »), en respectant les majuscules
#   (`[replace]`) ou sans (`[replace_any_case]`). Le texte autour, ponctuation comprise, ne bouge pas.
# - Le plus long gagne : « Wi-Fi 6 » avant « Wi-Fi ». Une entrée l'emporte sur la règle des sigles.
# - Un mot qui n'est pas que des lettres s'écrit entre guillemets à gauche : "Wi-Fi", "C++".
# - Un sigle (2 à 6 majuscules ou chiffres : SSH, MP3, 4G) qui n'a pas d'entrée est épelé avec les
#   noms des lettres, reliés par des traits d'union : SSH devient « èsse-èsse-ache ». Avec un « s » en plus (PCs), le « s » tombe.
#   Pour qu'un sigle soit dit comme un mot, l'ajouter à `not_spelled` ; pour le dire autrement,
#   lui donner une entrée.
# - Un moteur ne lit pas toujours comme un autre : si une lettre sonne faux, `[letters]` change
#   son nom (voir en bas).

# Les sigles dits comme des mots, jamais épelés (ils gardent leur écriture, avec ou sans « s »).
# Pocket les lit bien tels quels. « OK » et « YAML » en font partie : épelés, ils sonneraient faux.
not_spelled = [
  "NASA", "OVNI", "UNESCO", "OTAN", "ONU", "RAM", "LED", "LASER", "RADAR", "SIDA", "SMIC",
  "OUI", "NON", "OK", "YAML",
]

# Les mots remplacés, en respectant les majuscules et les minuscules.
#
# Ce que ce lexique corrige a été mesuré avec Pocket (voix estelle), en refaisant transcrire la
# synthèse : seuls les mots lus de travers y sont. « Docker », « Bluetooth », « YouTube »,
# « Google », « iPhone » ou « Wi-Fi » sont déjà bien lus, y toucher risquerait de les abîmer ; si
# un autre moteur les lit mal, les ajouter ici ou dans son propre fichier.
[replace]
GitHub = "guite-heub"
GitLab = "guite-lab"
Git = "guite"
Linux = "linuxe"
Android = "androïde"
Redis = "rédisse"
PostgreSQL = "postgresse-ku-èl"
Neo4j = "néo-fore-djé"
Rust = "reuste"
JSON = "djé-son"
Gmail = "djimèle"
OVNI = "ovni"
STOP = "stop"

# Les mots remplacés, quelle que soit l'écriture : une seule ligne pour « Okay », « okay » et
# « OKAY ». Rien par défaut.
[replace_any_case]

# Le nom des lettres et des chiffres pour l'épellation, à n'ajouter que pour en changer un (la
# clé est une majuscule ou un chiffre) :
# [letters]
# R = "èrre"
