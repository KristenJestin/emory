# Phrases d'attente du développeur : des accusés de réception neutres, dits dès la fin du tour,
# qui vont devant n'importe quelle réponse (même « Salut »). Copie de mind/prompts/waiting.fr.toml.

# Les phrases d'attente d'Emory (`[waiting] mode = "speech"`), en français.
#
# Ce fichier est un modèle générique : il ne nomme personne. Pour avoir les siennes, copier ce
# fichier, le modifier, et donner son chemin dans `[waiting] phrases = "..."` de `mind.toml`.
#
# Règles pour les écrire : très courtes, naturelles, jamais une promesse (« une seconde »,
# « j'arrive tout de suite ») ni une question, et rien qui s'adresse à la personne (tutoiement ou
# vouvoiement : Emory ne sait pas lequel, c'est la configuration de `mind` qui le dit au LLM).

# Dites quand rien de précis n'est cherché, ou quand les arguments d'un outil ne donnent rien de
# dicible. Tirées au hasard, sans retomber sur les dernières.
prewritten = [
  "D'accord.",
  "Ok.",
  "Oui.",
  "Bien.",
  "Bon.",
  "Alors.",
  "Voyons.",
  "Entendu.",
  "Très bien.",
  "Ok, voyons.",
  "Alors, voyons.",
  "D'accord, voyons.",
  "Bon, voyons.",
  "Oui, alors.",
  "Bien, alors.",
  "Ok, alors.",
  "Hum, voyons.",
  "Ah, voyons.",
  "Bon, alors.",
  "D'accord, alors.",
]

# Les phrases d'un outil de `mind`, par son nom tel que le voit le LLM (`<module>_<outil>`).
#
# - `argument` : l'argument de l'outil dont la valeur remplace `{}` dans `phrases`. Elle n'est dite
#   que si elle est dicible : quelques mots, sans identifiant, chemin, adresse ni code. Sinon (et
#   si l'outil n'a pas d'`argument`), on tire dans `plain`, puis dans `prewritten`.
# - `phrases` : avec `{}` exactement une fois.
# - `plain` : sans `{}`.
# - `silent = true` : cet outil ne fait jamais parler (il répond tout de suite).

[tools.hippocampe_search]
argument = "query"
phrases = [
  "Je regarde ce que j'ai sur {}.",
  "Je cherche ce que je sais sur {}.",
  "Voyons ce que j'ai sur {}.",
  "Je regarde dans mes notes pour {}.",
  "Je cherche {} dans mes notes.",
]
plain = [
  "Je regarde dans mes notes.",
  "Je cherche dans mes fiches.",
  "Je consulte mes notes.",
]

# La valeur de `entry` est un identifiant : elle n'est jamais dite.
[tools.hippocampe_read]
plain = [
  "Je regarde cette fiche.",
  "J'ouvre la fiche.",
  "Je relis la fiche.",
]

[tools.hippocampe_write]
plain = [
  "Je note ça.",
  "Je l'écris.",
  "J'écris ça dans mes notes.",
]

[tools.hippocampe_link]
plain = [
  "Je fais le lien.",
  "Je relie ça.",
]

[tools.hippocampe_types]
silent = true

[tools.dictionary_propose]
silent = true

[tools.dictionary_add]
argument = "word"
phrases = [
  "J'ajoute {} au dictionnaire.",
  "J'ajoute {} à mon dictionnaire.",
]
plain = [
  "J'ajoute ce mot.",
]

# La météo : le lieu est dit s'il est dicible (un nom de ville), sinon une phrase sans lieu.
[tools.web_weather]
argument = "place"
phrases = [
  "Je regarde la météo à {}.",
  "Je regarde le temps qu'il fait à {}.",
]
plain = [
  "Je regarde la météo.",
  "Je regarde le temps qu'il fait.",
  "Je regarde le ciel.",
]

# Le résumé d'un article Wikipédia : le sujet est dit s'il est dicible.
[tools.web_wikipedia]
argument = "query"
phrases = [
  "Je cherche {} sur Wikipédia.",
  "Je regarde ce que dit Wikipédia sur {}.",
]
plain = [
  "Je regarde sur Wikipédia.",
  "Je cherche sur Wikipédia.",
]

# La recherche sur le web : la requête est dite si elle est dicible (quelques mots, jamais une
# adresse), sinon une phrase sans sujet.
[tools.web_search]
argument = "query"
phrases = [
  "Je cherche {} sur le web.",
  "Je regarde ce que dit le web sur {}.",
]
plain = [
  "Je cherche sur le web.",
  "Je regarde sur le web.",
  "Je fais une recherche.",
]

# La lecture d'une page : son argument est une adresse, qui n'est jamais dite (d'où l'absence
# d'`argument`). Des verbes autres que « regarder » et « chercher » : la page se lit après une
# recherche ou un résumé, qui les ont déjà dits.
[tools.web_read]
plain = [
  "Je lis la page.",
  "Je lis cette page.",
  "J'ouvre la page.",
]

# Les minuteurs et rappels : posés, listés, annulés en un instant, la réponse suit aussitôt.
[tools.time_timer]
silent = true

[tools.time_reminder]
silent = true

[tools.time_list]
silent = true

[tools.time_cancel]
silent = true
