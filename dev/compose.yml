# The bus and the voice engine, to develop on the PC, on 127.0.0.1, without TLS or keys.
# The locked-down bus (TLS, nkeys, rights per subject) comes with the deployment on the server.
#   docker compose -f dev/compose.yml up -d
name: emory-dev

services:
  nats:
    image: nats:2.12-alpine
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: ["--http_port", "8222"]
    restart: unless-stopped

  pocket:
    build: ../engines/pocket
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POCKET_THREADS: "1"
    volumes:
      # The weights (a few hundred MB) are downloaded on the first start.
      - pocket-cache:/cache
    restart: unless-stopped

volumes:
  pocket-cache:
