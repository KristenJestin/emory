# Le bus pour développer sur le PC : NATS seul, sur 127.0.0.1, sans TLS ni clés.
# Le bus verrouillé (TLS, nkeys, droits par sujet) arrive avec le déploiement sur le serveur.
#   docker compose -f dev/compose.yml up -d
name: emory-dev

services:
  nats:
    image: nats:2.12-alpine
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: ["--http_port", "8222"]
    restart: unless-stopped
