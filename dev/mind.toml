# The mind on the PC through ACP (the Claude subscription), from the root of the repository:
# `cargo run -p mind -- dev/mind.toml`. The direct API: `dev/mind-api.toml`.
# Hippocampe is the developer's real memory: in development the mind reads it with the read-only key.

[llm]
mode = "acp"
command = "npx"
args = ["-y", "@agentclientprotocol/claude-agent-acp@0.89.1"]
model = "claude-haiku-5-5"
system_prompt = "mind/prompts/system.fr.md"

[owner]
name = "Kris"
address = "un homme ; tu le tutoies"

[hippocampe]
url = "https://wiki.krisnet.work/mcp"
token_file = "~/.krisnet/hippocampe-prod-readonly.token"

# While the answer is prepared the owner hears a tone, then a soft pulse if it takes long.
# To try the other kind, a short spoken phrase: mode = "speech" (see mind/examples/mind.toml).
[waiting]
mode = "tone"
