# The voice with Kyutai TTS 1.6B on the graphics card (engines/kyutai/run-native.sh, port 8001).
# Pocket (voice.toml) stays the development voice: this one is for trying the voice chosen by the developer.
nats_url = "nats://127.0.0.1:4222"
engine = "kyutai"
engine_url = "http://127.0.0.1:8001"
voice = "cml-tts/fr/5476_3103_000072-0001.wav"

# The pronunciation lexicon, tuned on Pocket: Kyutai may read some of these words right without it
# (`lexicon_enabled = false` switches the stage off, to compare).
lexicon = "lexicon.fr.toml"

# The loudness of the voice: same stage as voice.toml (the levels of Kyutai are not measured yet,
# the stage brings the speech to the target whatever they are).
[loudness]
enabled = true
target = -14.0

[kyutai]
padding_bonus = -3.0
max_padding = 8
temp = 0.6
cfg_coef = 2.0
